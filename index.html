<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egzamin kierowcy zawodowego</title>
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#1d2430;--mut:#667085;--line:#d9d9d2;--acc:#f2b800;--accink:#1d2430;--ok:#1d7a46;--okbg:#e3f4ea;--bad:#b42318;--badbg:#fde8e6;--sel:#e8eefc;--selb:#2f5fd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1e2430;--ink:#eef1f6;--mut:#9aa4b5;--line:#323a49;--ok:#5fd18b;--okbg:#17321f;--bad:#ff8b80;--badbg:#3a1c19;--sel:#1f2f55;--selb:#7aa2ff}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1e2430;--ink:#eef1f6;--mut:#9aa4b5;--line:#323a49;--ok:#5fd18b;--okbg:#17321f;--bad:#ff8b80;--badbg:#3a1c19;--sel:#1f2f55;--selb:#7aa2ff}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.6rem;line-height:1.2;margin:8px 0 4px}
h2{font-size:1.15rem;margin:24px 0 8px}
p{margin:6px 0}.mut{color:var(--mut);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;min-height:44px}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--selb);outline-offset:2px}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row>*{flex:1 1 140px}
.ans{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;align-items:flex-start}
.ans b{min-width:1.4em}
.ans.sel{background:var(--sel);border-color:var(--selb)}
.ans.ok{background:var(--okbg);border-color:var(--ok)}
.ans.bad{background:var(--badbg);border-color:var(--bad)}
.ans.dis{cursor:default}
.res{font-size:2.6rem;font-weight:800;line-height:1.1}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.hist button{padding:6px 12px;min-height:36px}
.note{font-size:.88rem;color:var(--mut);border-left:3px solid var(--acc);padding-left:8px;margin:8px 0}
input[type=file]{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const N=30,PASS=24,KQ="egzamin.pytania",KH="egzamin.historia";
const $=document.getElementById("app");
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let Q=rd(KQ)||[],H=rd(KH)||[],E=null,err="";

function load(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d))throw 0;
      const ok=d.filter(q=>q&&q.pytanie&&q.odpowiedzi&&q.poprawna&&q.odpowiedzi[q.poprawna]);
      if(!ok.length)throw 0;
      Q=ok.map(q=>({s:q.strona,n:q.numer,p:q.pytanie,o:q.odpowiedzi,c:q.poprawna}));
      Q.skipped=d.length-ok.length;wr(KQ,Q);err="";
    }catch(e){err="Nie udało się odczytać pliku. Wybierz plik pytania.json."}
    home();
  };
  r.readAsText(file);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(t){return new Date(t).toLocaleString("pl-PL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}

function home(){
  E=null;
  const can=Q.length>=N;
  $.innerHTML=`<h1>Egzamin kierowcy zawodowego</h1>
  <p class="mut">${N} losowych pytań, do zaliczenia potrzeba ${PASS} poprawnych odpowiedzi.</p>
  <div class="card">
    <p>${Q.length?`Wczytano <b>${Q.length}</b> pytań.`:"Wczytaj plik pytania.json, aby zacząć."}</p>
    ${err?`<p class="fail">${esc(err)}</p>`:""}
    <div class="row">
      <button class="pri" id="go" ${can?"":"disabled"}>Rozpocznij egzamin</button>
      <label class="btn" tabindex="0" id="lbl" style="text-align:center">${Q.length?"Wczytaj inny plik":"Wybierz plik pytania.json"}<input type="file" id="f" accept=".json,application/json"></label>
    </div>
    ${Q.length&&!can?`<p class="fail">Za mało pytań (minimum ${N}).</p>`:""}
  </div>
  <h2>Poprzednie egzaminy</h2>
  ${H.length?H.map((h,i)=>`<div class="hist"><div><b class="${h.ok?"pass":"fail"}">${h.sc}/${h.n}</b> ${h.ok?"zaliczony":"niezaliczony"}<div class="mut">${fmt(h.t)}</div></div>
  <button data-r="${i}" ${h.w.length?"":"disabled"}>Błędne odpowiedzi (${h.w.length})</button></div>`).join(""):`<p class="mut">Jeszcze nie rozwiązano żadnego egzaminu.</p>`}`;
  document.getElementById("f").onchange=e=>e.target.files[0]&&load(e.target.files[0]);
  document.getElementById("lbl").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();document.getElementById("f").click()}};
  const g=document.getElementById("go");if(g)g.onclick=start;
  $.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>review(H[b.dataset.r].w,()=>home()));
}

function start(){E={it:shuffle(Q).slice(0,N),a:[],i:0};ask()}

function imgNote(q){return Object.values(q.o).every(t=>t.length<=3)?`<p class="note">To pytanie odnosi się do rysunku. Zobacz stronę ${q.s} w PDF.</p>`:""}

function ask(){
  const q=E.it[E.i],last=E.i===N-1,a=E.a[E.i];
  $.innerHTML=`<p class="mut">Pytanie ${E.i+1} z ${N}</p>
  <div class="bar"><i style="width:${(E.i+1)/N*100}%"></i></div>
  <div class="card"><p><b>${esc(q.p)}</b></p>${imgNote(q)}
  ${Object.entries(q.o).map(([k,t])=>`<button class="ans ${a===k?"sel":""}" data-k="${k}"><b>${k}</b><span>${esc(t)}</span></button>`).join("")}</div>
  <div class="row"><button id="pv" ${E.i?"":"disabled"}>Wstecz</button>
  <button class="pri" id="nx">${last?"Zakończ egzamin":"Dalej"}</button></div>`;
  $.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{E.a[E.i]=b.dataset.k;ask()});
  document.getElementById("pv").onclick=()=>{E.i--;ask()};
  document.getElementById("nx").onclick=()=>{
    if(!last){E.i++;ask();return}
    const un=E.it.filter((_,i)=>!E.a[i]).length;
    if(un&&!confirm(`Bez odpowiedzi: ${un}. Zakończyć egzamin? Takie pytania liczą się jako błędne.`))return;
    finish();
  };
  window.scrollTo(0,0);
}

function finish(){
  const w=[];let sc=0;
  E.it.forEach((q,i)=>{E.a[i]===q.c?sc++:w.push({s:q.s,n:q.n,p:q.p,o:q.o,c:q.c,u:E.a[i]||null})});
  const rec={t:Date.now(),sc,n:N,ok:sc>=PASS,w};
  H.unshift(rec);H=H.slice(0,30);wr(KH,H);
  $.innerHTML=`<h1>Wynik egzaminu</h1>
  <div class="card"><div class="res ${rec.ok?"pass":"fail"}">${sc} / ${N}</div>
  <p><b>${rec.ok?"Egzamin zaliczony":"Egzamin niezaliczony"}</b></p>
  <p class="mut">Do zaliczenia potrzeba ${PASS} poprawnych odpowiedzi. Błędnych: ${w.length}.</p></div>
  <div class="row"><button class="pri" id="rv" ${w.length?"":"disabled"}>Zobacz błędne odpowiedzi</button>
  <button id="nw">Nowy egzamin</button><button id="hm">Menu</button></div>`;
  document.getElementById("rv").onclick=()=>review(w,finishView(rec));
  document.getElementById("nw").onclick=start;
  document.getElementById("hm").onclick=home;
  window.scrollTo(0,0);
}
function finishView(rec){return()=>{E=null;home()}}

function review(w,back){
  $.innerHTML=`<h1>Błędne odpowiedzi</h1><p class="mut">${w.length} z ${N} pytań</p>
  ${w.map((q,i)=>`<div class="card"><p class="mut">${i+1}. (str. ${q.s} w PDF)</p><p><b>${esc(q.p)}</b></p>${imgNote(q)}
  ${Object.entries(q.o).map(([k,t])=>{
    const c=k===q.c?"ok":k===q.u?"bad":"";
    const tag=k===q.c?" (poprawna)":k===q.u?" (twoja odpowiedź)":"";
    return `<div class="ans dis ${c}"><b>${k}</b><span>${esc(t)}<i class="mut">${tag}</i></span></div>`}).join("")}
  ${q.u?"":`<p class="fail">Brak odpowiedzi.</p>`}</div>`).join("")}
  <div class="row"><button id="bk">Wróć</button><button class="pri" id="nw">Nowy egzamin</button></div>`;
  document.getElementById("bk").onclick=back;
  document.getElementById("nw").onclick=()=>{if(Q.length>=N)start();else home()};
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
