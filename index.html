<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egzamin Kierowcy Zawodowego</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Nagłówek -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-20">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-md">
                    <i class="fa-solid fa-truck-fast text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white">Egzamin Kierowcy Zawodowego</h1>
                    <p id="header-mode" class="text-xs text-slate-400">Wybierz tryb</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Główna zawartość -->
    <main class="max-w-3xl mx-auto px-4 py-8 w-full flex-grow flex items-center justify-center">

        <!-- Ekran startowy -->
        <div id="start-screen" class="w-full bg-slate-900 rounded-3xl p-8 border border-slate-800 shadow-2xl text-center">
            <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-2xl flex items-center justify-center mx-auto mb-5 text-2xl">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Platforma Szkoleniowa</h2>
            <p class="text-slate-400 text-sm mb-8 leading-relaxed">
                Aplikacja zawiera wbudowaną bazę <span id="db-count" class="text-indigo-400 font-bold">0</span> pytań.
            </p>

            <div class="flex flex-col gap-4 max-w-sm mx-auto">
                <button onclick="startMode('exam')" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-stopwatch text-lg"></i>
                    Egzamin (30 losowych pytań)
                </button>
                
                <button onclick="startMode('learning')" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-book-open text-lg"></i>
                    Tryb Nauki (krok po kroku)
                </button>
                
                <button onclick="resetProgress()" class="w-full py-2 mt-4 bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-bold rounded-xl transition border border-slate-700">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Zresetuj postęp nauki
                </button>
            </div>
        </div>

        <!-- Ekran quizu -->
        <div id="quiz-screen" class="hidden w-full bg-slate-900 rounded-3xl p-6 md:p-8 border border-slate-800 shadow-2xl">
            <div class="mb-6">
                <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-2">
                    <span id="question-tracker">Pytanie 1 z 0</span>
                    <span id="score-tracker" class="text-indigo-400">Wynik: 0</span>
                </div>
                <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
                    <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all"></div>
                </div>
            </div>

            <h3 id="question-text" class="text-lg font-semibold text-slate-100 mb-6 leading-relaxed">
                Treść pytania...
            </h3>

            <div id="options-container" class="space-y-3 mb-6">
                <!-- Opcje generowane dynamicznie -->
            </div>

            <div class="flex justify-between items-center pt-4 border-t border-slate-800">
                <button onclick="goToMenu()" class="text-xs font-bold text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-house mr-1"></i> Zakończ
                </button>
                <button id="next-btn" onclick="nextQuestion()" disabled class="px-6 py-2.5 bg-indigo-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-indigo-500 text-white font-bold rounded-xl transition text-xs">
                    Następne <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- Ekran wyników -->
        <div id="result-screen" class="hidden w-full bg-slate-900 rounded-3xl p-8 border border-slate-800 shadow-2xl text-center">
            <div class="w-20 h-20 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-2xl flex items-center justify-center mx-auto mb-5 text-3xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Koniec testu!</h2>
            <p id="result-desc" class="text-slate-400 text-sm mb-6">Twój wynik:</p>

            <div class="text-5xl font-extrabold text-white mb-8">
                <span id="res-correct" class="text-emerald-400">0</span> / <span id="res-total" class="text-slate-500">30</span>
            </div>

            <button onclick="goToMenu()" class="px-8 py-3 w-full max-w-xs mx-auto bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition text-sm">
                Wróć do menu
            </button>
        </div>

    </main>

    <script>
        // =========================================================
        // TUTAJ JUTRO WKLEISZ ZAWARTOŚĆ PLIKU JSON Z POPRAWNYMI LITERKAMI
        // =========================================================
        const WBUDOWANA_BAZA = [
            {
                "id": 1,
                "question": "Jaki rodzaj transportu jest najbardziej niebezpieczny z punktu widzenia zagrożenia życia?",
                "options": [
                    { "key": "a", "text": "Lotniczy." },
                    { "key": "b", "text": "Wodny." },
                    { "key": "c", "text": "Drogowy." }
                ],
                "correct": "c"
            },
            {
                "id": 2,
                "question": "Które z niżej wymienionych wypadków drogowych zdarzają się w Polsce najczęściej?",
                "options": [
                    { "key": "a", "text": "Najechanie na zaporę kolejową." },
                    { "key": "b", "text": "Zderzenie się pojazdów w ruchu." },
                    { "key": "c", "text": "Wywrócenie się pojazdu." }
                ],
                "correct": "b"
            }
            // Tu znajdzie się reszta 688 pytań...
        ];
        // =========================================================

        let currentPool = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let mode = 'exam'; // 'exam' lub 'learning'

        document.getElementById('db-count').textContent = WBUDOWANA_BAZA.length;

        function startMode(selectedMode) {
            if (WBUDOWANA_BAZA.length === 0) {
                alert("Baza pytań jest pusta."); return;
            }
            
            mode = selectedMode;
            score = 0;
            answered = false;

            if (mode === 'exam') {
                document.getElementById('header-mode').textContent = "Tryb: Egzamin";
                // Losowanie 30 pytań z całej bazy
                currentPool = [...WBUDOWANA_BAZA].sort(() => 0.5 - Math.random()).slice(0, 30);
                currentIndex = 0;
            } else if (mode === 'learning') {
                document.getElementById('header-mode').textContent = "Tryb: Nauka";
                currentPool = [...WBUDOWANA_BAZA]; // Wszystkie pytania po kolei
                // Odczytanie zapisanego postępu
                const savedIndex = localStorage.getItem('learningProgress');
                currentIndex = savedIndex ? parseInt(savedIndex) : 0;
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const q = currentPool[currentIndex];

            if (mode === 'learning') {
                // Zapisz postęp w przeglądarce
                localStorage.setItem('learningProgress', currentIndex);
            }

            document.getElementById('question-tracker').textContent = `Pytanie ${currentIndex + 1} z ${currentPool.length}`;
            document.getElementById('score-tracker').textContent = mode === 'exam' ? `Wynik: ${score}` : 'Postęp nauki';
            document.getElementById('question-text').textContent = q.question;
            document.getElementById('progress-bar').style.width = `${((currentIndex) / currentPool.length) * 100}%`;
            
            document.getElementById('next-btn').disabled = true;
            document.getElementById('next-btn').innerHTML = currentIndex === currentPool.length - 1 
                ? 'Zakończ <i class="fa-solid fa-flag ml-1"></i>' 
                : 'Następne <i class="fa-solid fa-chevron-right ml-1"></i>';

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl border border-slate-800 bg-slate-950/60 hover:bg-slate-800/60 transition flex items-start gap-4 option-btn option-${opt.key}`;
                btn.onclick = () => selectOption(opt.key);
                btn.innerHTML = `
                    <div class="opt-key w-8 h-8 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-slate-300 flex-shrink-0">
                        ${opt.key.toUpperCase()}
                    </div>
                    <div class="text-sm text-slate-200 font-medium pt-1">${opt.text}</div>
                `;
                container.appendChild(btn);
            });
        }

        function selectOption(key) {
            if (answered) return;
            answered = true;
            
            const q = currentPool[currentIndex];
            const isCorrect = (key === q.correct);
            if (isCorrect) score++;

            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            
            const correctBtn = document.querySelector(`.option-${q.correct}`);
            if (correctBtn) {
                correctBtn.className = "w-full text-left p-4 rounded-2xl border border-emerald-500/50 bg-emerald-500/10 text-emerald-300 transition flex items-start gap-4";
                correctBtn.querySelector('.opt-key').className = "w-8 h-8 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs flex items-center justify-center flex-shrink-0";
            }

            if (!isCorrect) {
                const wrongBtn = document.querySelector(`.option-${key}`);
                if (wrongBtn) {
                    wrongBtn.className = "w-full text-left p-4 rounded-2xl border border-rose-500/50 bg-rose-500/10 text-rose-300 transition flex items-start gap-4";
                    wrongBtn.querySelector('.opt-key').className = "w-8 h-8 rounded-xl bg-rose-500 text-slate-950 font-bold text-xs flex items-center justify-center flex-shrink-0";
                }
            }

            document.getElementById('score-tracker').textContent = mode === 'exam' ? `Wynik: ${score}` : 'Postęp nauki';
            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            if (currentIndex < currentPool.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                if (mode === 'learning') {
                    localStorage.removeItem('learningProgress'); // Reset po przejściu całej bazy
                }
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('res-correct').textContent = score;
            document.getElementById('res-total').textContent = currentPool.length;
        }

        function goToMenu() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('header-mode').textContent = "Wybierz tryb";
        }

        function resetProgress() {
            if(confirm("Czy na pewno chcesz zresetować postęp w Trybie Nauki?")) {
                localStorage.removeItem('learningProgress');
                alert("Postęp został zresetowany. Zaczniesz od pytania nr 1.");
            }
        }
    </script>
</body>
</html>
